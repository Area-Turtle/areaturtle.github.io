name: CI/CD GitHub Pages Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # 1. BUILD
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build project
        run: echo "Building project..."

  # 2. LINT
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Lint HTML/CSS
        run: echo "Linting files..."

  # 3. PREPARE SITE
  prepare:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare site files
        run: echo "Preparing site..."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  # 4. DEPLOY + PUBLISH
  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4